# See docs/backend-infrastructure-notes.md for what this file is (and isn't) for.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flowra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowra
      POSTGRES_PASSWORD: flowra
      POSTGRES_DB: flowra_dev
    ports:
      - '5432:5432'
    volumes:
      - flowra_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowra -d flowra_dev']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: flowra_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - flowra_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.43
    container_name: flowra_seaweedfs
    restart: unless-stopped
    command: server -dir=/data -filer -s3 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
    ports:
      # - '9333:9333' # master
      # - '8888:8888' # filer
      - '8333:8333' # S3 API
    volumes:
      - flowra_seaweedfs_data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:9333/cluster/status']
      interval: 5s
      timeout: 5s
      retries: 10

  seaweedfs-admin:
    image: chrislusf/seaweedfs:4.43
    container_name: flowra_seaweedfs_admin
    restart: unless-stopped
    command: admin -port=23646 -masters=seaweedfs:9333 -adminUser=admin
    environment:
      WEED_ADMIN_PASSWORD: admin
    ports:
      - '23646:23646' # admin dashboard
    depends_on:
      seaweedfs:
        condition: service_healthy

volumes:
  flowra_postgres_data:
  flowra_redis_data:
  flowra_seaweedfs_data:
